<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190" role="img" aria-hidden="true">
  <title>Two-tier birthday cake illustration with five lit candles</title>

  <!-- plate -->
  <ellipse cx="110" cy="170" rx="82" ry="10" fill="#f0a6ac" opacity="0.5"/>

  <!-- bottom tier -->
  <rect x="34" y="120" width="152" height="48" rx="8" fill="#f0a6ac"/>
  <path d="M34 132 q 19 -10 38 0 q 19 -10 38 0 q 19 -10 38 0 q 19 -10 38 0 v 10 q -19 10 -38 0 q -19 10 -38 0 q -19 10 -38 0 q -19 10 -38 0 Z" fill="#fdf8ee" opacity="0.9"/>

  <!-- top tier -->
  <rect x="60" y="82" width="100" height="42" rx="8" fill="#fdf8ee" stroke="#c8393a" stroke-width="2" opacity="0.95"/>
  <path d="M60 92 q 12.5 -8 25 0 q 12.5 -8 25 0 q 12.5 -8 25 0 q 12.5 -8 25 0 v 8 q -12.5 8 -25 0 q -12.5 8 -25 0 q -12.5 8 -25 0 q -12.5 8 -25 0 Z" fill="#c8393a" opacity="0.85"/>

  <!-- drips -->
  <circle cx="72" cy="82" r="5" fill="#c8393a"/>
  <circle cx="98" cy="82" r="5" fill="#eab54a"/>
  <circle cx="124" cy="82" r="5" fill="#c8393a"/>
  <circle cx="150" cy="82" r="5" fill="#eab54a"/>

  <!-- candles -->
  <g>
    <rect x="70" y="52" width="6" height="30" rx="2" fill="#c8393a"/>
    <rect x="90" y="46" width="6" height="36" rx="2" fill="#eab54a"/>
    <rect x="110" y="40" width="6" height="42" rx="2" fill="#c8393a"/>
    <rect x="130" y="46" width="6" height="36" rx="2" fill="#eab54a"/>
    <rect x="150" y="52" width="6" height="30" rx="2" fill="#c8393a"/>
  </g>

  <!-- flames -->
  <g fill="#eab54a">
    <ellipse cx="73" cy="46" rx="4" ry="7"/>
    <ellipse cx="93" cy="40" rx="4" ry="7"/>
    <ellipse cx="113" cy="34" rx="4.5" ry="8"/>
    <ellipse cx="133" cy="40" rx="4" ry="7"/>
    <ellipse cx="153" cy="46" rx="4" ry="7"/>
  </g>
  <g fill="#c8393a">
    <ellipse cx="73" cy="47" rx="2" ry="3.5"/>
    <ellipse cx="93" cy="41" rx="2" ry="3.5"/>
    <ellipse cx="113" cy="35" rx="2.2" ry="4"/>
    <ellipse cx="133" cy="41" rx="2" ry="3.5"/>
    <ellipse cx="153" cy="47" rx="2" ry="3.5"/>
  </g>

  <!-- sprinkles on bottom tier -->
  <g fill="#c8393a" opacity="0.7">
    <rect x="46" y="146" width="6" height="2.5" rx="1" transform="rotate(20 46 146)"/>
    <rect x="164" y="150" width="6" height="2.5" rx="1" transform="rotate(-15 164 150)"/>
    <rect x="106" y="152" width="6" height="2.5" rx="1" transform="rotate(40 106 152)"/>
  </g>
</svg>
